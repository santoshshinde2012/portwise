name: Dependency security

# Recheck even when no code changes: newly published advisories must not wait for the next PR.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security
  cancel-in-progress: false

jobs:
  audit:
    name: current dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust advisories, licenses and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      - name: Verify vendored GLib backport and dependency resolution
        run: python3 scripts/verify-vendored-glib.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Desktop npm advisories (all severities)
        working-directory: apps/desktop
        run: npm audit
      - name: Website npm advisories (all severities)
        working-directory: site
        run: npm audit
