# Desktop installers (.dmg, .msi + NSIS .exe, .AppImage, .deb, .rpm) built by tauri-action and
# attached to the GitHub Release that release.yml (dist) created for the same `vX.Y.Z` tag, with
# SHA-256 checksums and SLSA build provenance. release.yml calls this reusable workflow after it
# publishes the release (dist's `post-announce-jobs`), so it builds the tag's own commit.
#
# Optional, each skipped when its secrets are absent:
# - macOS signing + notarisation: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID. Without them
#   the app is ad-hoc signed (tauri.conf.json signingIdentity "-"): macOS then shows the usual
#   "unidentified developer" prompt instead of calling a quarantined download "damaged".
# - Windows Authenticode: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD.
# - Signed auto-updates: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and the
#   repository variable TAURI_UPDATER_PUBKEY. Adds updater bundles and latest.json.
#
# Dry run: run it manually with an empty tag; the bundles are kept as workflow artifacts and
# nothing is published. With a tag it (re)uploads to that existing release.
name: Desktop release

on:
  workflow_call:
    inputs:
      plan:
        description: "dist's plan (JSON) for the release that was just published"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (vX.Y.Z); empty = dry run that only builds"
        required: false
        default: ""

permissions: {}

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      updater: ${{ steps.plan.outputs.updater }}
    steps:
      - id: plan
        env:
          PLAN: ${{ inputs.plan }}
          INPUT_TAG: ${{ inputs.tag }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
        run: |
          if [ -n "$PLAN" ]; then tag=$(jq -r '.announcement_tag // empty' <<<"$PLAN"); else tag=$INPUT_TAG; fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag isn't a vX.Y.Z tag"; exit 1
          fi
          { echo "tag=$tag"; echo "updater=$HAS_UPDATER_KEY"; } >> "$GITHUB_OUTPUT"
          echo "### Desktop ${tag:-dry run} (updater: $HAS_UPDATER_KEY)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            target: ""
            args: ""
          - name: windows-x64
            os: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload to the release
      id-token: write # attestations
      attestations: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Called by release.yml: the pushed tag's commit. By hand: the tag, or the chosen branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm
      - run: npm ci
        working-directory: apps/desktop

      # Each optional capability writes a config overlay and/or env vars only when its secrets
      # exist, so forks and unsigned builds still succeed.
      - name: Updater (signed latest.json), if configured
        if: needs.plan.outputs.updater == 'true'
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REPO: ${{ github.repository }}
        run: |
          jq -n --arg pk "$PUBKEY" --arg url "https://github.com/$REPO/releases/latest/download/latest.json" \
            '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $pk, endpoints: [$url]}}}' \
            > apps/desktop/src-tauri/tauri.updater.conf.json
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__KEY__"; echo "$KEY"; echo "__KEY__"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "EXTRA_ARGS=${EXTRA_ARGS:-} --config src-tauri/tauri.updater.conf.json"
          } >> "$GITHUB_ENV"
      - name: macOS signing and notarisation, if configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "::notice::No Apple certificate: the app is ad-hoc signed, not notarised"; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
          done
      - name: Windows signing, if configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Output "::notice::No Windows certificate: the installers are unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 apps/desktop/src-tauri/tauri.windows-sign.conf.json
          "EXTRA_ARGS=$env:EXTRA_ARGS --config src-tauri/tauri.windows-sign.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (and upload to the release)
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          # With a tag the release already exists (dist created it), so tauri-action only uploads.
          tagName: ${{ needs.plan.outputs.tag }}
          args: ${{ matrix.args }} ${{ env.EXTRA_ARGS }}
          uploadUpdaterJson: ${{ needs.plan.outputs.updater == 'true' }}
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: ${{ needs.plan.outputs.tag == '' }}
          workflowArtifactNamePattern: holdmap-desktop-${{ matrix.name }}-[bundle] # [name] is the product name, the same for every bundle

      # An unsealed bundle (only the linker's signature on the binary) is what macOS reports as
      # "damaged" once the download is quarantined, so check the app inside each .dmg.
      - name: Verify the macOS app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(target/*/release/bundle/dmg/*.dmg)
          [ ${#dmgs[@]} -gt 0 ] || { echo "::error::no .dmg was built"; exit 1; }
          for dmg in "${dmgs[@]}"; do
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            app=("$mnt"/*.app)
            codesign --verify --deep --strict --verbose=2 "${app[0]}"
            info=$(codesign -dv --verbose=4 "${app[0]}" 2>&1)
            echo "$info" | grep -E '^(Identifier|Format|CodeDirectory|Signature|TeamIdentifier|Sealed Resources|Info.plist)'
            grep -q '^Sealed Resources version' <<<"$info" || { echo "::error::$dmg: app bundle isn't sealed"; exit 1; }
            grep -q 'linker-signed' <<<"$info" && { echo "::error::$dmg: only the linker's signature"; exit 1; }
            hdiutil detach "$mnt" >/dev/null
          done

      # tauri-action uploads as it builds; a flaky GitHub upload once dropped the Windows NSIS
      # mid-transfer ("other side closed") and skipped Collect/checksums. Always collect from
      # disk and re-upload with retries so a network blip can't leave a release incomplete.
      - name: Collect the installers
        id: files
        if: always() && steps.tauri.outcome != 'skipped'
        shell: bash
        run: |
          shopt -s nullglob # (no globstar: macOS runners ship bash 3.2)
          files=()
          for d in target/release/bundle target/*/release/bundle; do
            files+=("$d"/dmg/*.dmg "$d"/msi/*.msi "$d"/nsis/*.exe "$d"/deb/*.deb "$d"/rpm/*.rpm "$d"/appimage/*.AppImage)
          done
          [ ${#files[@]} -gt 0 ] || { echo "::error::no installers were built"; exit 1; }
          sum="holdmap-desktop-${{ matrix.name }}.sha256"
          if command -v sha256sum >/dev/null; then sha256sum "${files[@]}"; else shasum -a 256 "${files[@]}"; fi \
            | sed -E 's#^([0-9a-f]+) [ *](.*/)?#\1  #' > "$sum" # bare names; Windows marks binary files with '*'
          cat "$sum"
          printf '%s\n' "${files[@]}" > "${sum}.paths"
          { echo "sum=$sum"; echo "paths<<__P__"; printf '%s\n' "${files[@]}"; echo "__P__"; } >> "$GITHUB_OUTPUT"
      - name: Upload installers to the release
        if: env.TAG != '' && steps.files.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # bash 3.2 on macOS has no mapfile; read paths line-by-line
          files=()
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "$line" ] && files+=("$line")
          done < "${{ steps.files.outputs.sum }}.paths"
          [ ${#files[@]} -gt 0 ] || { echo "::error::no installer paths to upload"; exit 1; }
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"; then
              echo "uploaded ${#files[@]} installers (attempt $attempt)"
              exit 0
            fi
            echo "::warning::upload attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::could not upload installers after 5 attempts"
          exit 1
      - name: Build provenance
        if: env.TAG != '' && steps.files.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.paths }}
      - name: Upload checksums to the release
        if: env.TAG != '' && steps.files.outcome == 'success'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            gh release upload "$TAG" "${{ steps.files.outputs.sum }}" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

  notes:
    # tauri-action rewrites the existing release with an empty body; put dist's notes back.
    needs: [plan, build]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Restore the release notes from dist-manifest.json
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern dist-manifest.json --dir "$RUNNER_TEMP"
          jq -r '.announcement_github_body // ""' "$RUNNER_TEMP/dist-manifest.json" > "$RUNNER_TEMP/notes.md"
          title=$(jq -r '.announcement_title // empty' "$RUNNER_TEMP/dist-manifest.json")
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::warning::dist-manifest.json has no release notes"; exit 0; }
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          {
            printf '\n## Install the desktop app\n\n| File | Checksums |\n|--------|-----------|\n'
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -E '\.(dmg|msi|exe|AppImage|deb|rpm)$' | sort | while read -r f; do
                  case "$f" in
                    *aarch64.dmg) sum=macos-arm64 ;; *.dmg) sum=macos-x64 ;;
                    *.msi|*.exe) sum=windows-x64 ;; *) sum=linux-x64 ;;
                  esac
                  echo "| [$f]($base/$f) | [holdmap-desktop-$sum.sha256]($base/holdmap-desktop-$sum.sha256) |"
                done
            # shellcheck disable=SC2016 # literal backticks for markdown
            printf '\nThe installers have build-provenance attestations too (`gh attestation verify <file> --repo %s`).\n' "$GITHUB_REPOSITORY"
          } >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md" ${title:+--title "$title"}
