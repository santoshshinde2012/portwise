name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
# Each workspace/platform clippy command denies first-party warnings. Avoid a global
# rustc warning override on the byte-preserved upstream GLib dependency.

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Placeholder frontend for tauri::generate_context!
        run: mkdir -p apps/desktop/dist && echo '<html></html>' > apps/desktop/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust docs (no missing docs, no broken intra-doc links)
        run: cargo doc --no-deps --locked -p holdmap-core -p holdmap-mcp -p holdmap
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Versions agree (Cargo, npm, Tauri, release-please)
        run: scripts/check-versions.sh

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The desktop crate is excluded here (it has its own job); default-members are core/cli/mcp.
      - name: Clippy (platform-specific code)
        run: cargo clippy -p holdmap-core -p holdmap -p holdmap-mcp --all-targets --locked -- -D warnings
      # Includes the docs checks: docs/cli.md vs clap, README commands and flags, Markdown links
      # and anchors, orphaned screenshots and file-naming conventions.
      - name: Test
        run: cargo test -p holdmap-core -p holdmap -p holdmap-mcp --locked
      - name: Smoke test the CLI against the real OS
        shell: bash
        run: |
          cargo run -q -p holdmap -- list --all
          cargo run -q -p holdmap -- list --json > /dev/null
          cargo run -q -p holdmap -- free-port --count 3
          cargo run -q -p holdmap -- explain 1 || test $? -eq 1

  supply-chain:
    name: supply chain (cargo-deny, npm audit, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      - name: Verify vendored GLib backport and dependency resolution
        run: python3 scripts/verify-vendored-glib.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            site/package-lock.json
      - name: npm audit desktop (all severities)
        working-directory: apps/desktop
        run: npm audit
      - name: npm audit website (all severities)
        working-directory: site
        run: npm audit
      - name: Release security regressions
        run: python3 scripts/test-release-security.py
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "$ACTIONLINT_SHA256  $f" | sha256sum -c -
          tar xzf "$f" actionlint
          ./actionlint -color

  secrets:
    name: source and history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tool_dir=$(mktemp -d)
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive" -o "$tool_dir/$archive"
          echo "$GITLEAKS_SHA256  $tool_dir/$archive" | sha256sum -c -
          tar xzf "$tool_dir/$archive" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - run: scripts/check-secrets.sh

  frontend:
    name: desktop frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      # test:e2e builds the production UI before starting its managed preview server.
      - run: npm run test:e2e
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-browser-failures
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: desktop build (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
        working-directory: apps/desktop
      - name: Build the app (no installers)
        run: npx tauri build --no-bundle
        working-directory: apps/desktop
      - name: Native desktop tests
        run: cargo test -p holdmap-desktop --locked
      - name: Optimized Linux GLib security regression
        if: runner.os == 'Linux'
        run: cargo test -p holdmap-desktop --locked --config 'profile.test.package.glib.opt-level=3' --test glib_security
