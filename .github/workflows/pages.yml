name: Pages

# Builds the website (site/) with the live demo (apps/desktop in browser mode) and deploys it to
# https://santoshshinde2012.github.io/holdmap/. Pull requests only build and check.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/desktop/**"
      - "docs/**"
      - "version.txt"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "apps/desktop/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Rebuild after a publishing release, not a pull request's release-plan check.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy_from_branch:
        description: Publish this branch to the public site (requires an allowed environment branch)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build + check
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            site/package-lock.json
      - name: Install (desktop app, for the live demo)
        working-directory: apps/desktop
        run: npm ci
      - name: Install (site)
        working-directory: site
        run: npm ci
      - name: npm audit (all severities)
        working-directory: site
        run: npm audit
      - name: Type check
        working-directory: site
        run: npm run check
      - name: Build
        working-directory: site
        env:
          # Read-only: the latest release tag and the star count, shown on the page.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - name: Links and size budget
        working-directory: site
        run: npm test
      - name: Install browser for the embedded demo check
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium
      - name: Embedded demo end-to-end check
        working-directory: site
        run: npm run test:demo
      - name: Embedded demo failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-browser-failures
          path: site/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record the published revision
        working-directory: site
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/build-info.json', JSON.stringify({
            revision: process.env.GITHUB_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            run_id: process.env.GITHUB_RUN_ID,
          }) + '\n');
          JS
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy_from_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
